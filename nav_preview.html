<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小夏的美食手账 - 左侧分类导航预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
body { background: #e9e9ec; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.phone { position: relative; width: 375px; height: 720px; background: #f5f5f5; border-radius: 36px; border: 2px solid #c9c9cf; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.15); }

/* 顶部标题 */
.topbar { height: 48px; background: #ff6b35; color: #fff; font-size: 17px; font-weight: bold; text-align: center; line-height: 48px; flex-shrink: 0; z-index: 5; }

/* 主体：左分类 + 右内容 */
.main { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ===== 左侧分类栏 ===== */
.sidebar { width: 86px; background: #f7f6f3; overflow-y: auto; flex-shrink: 0; scrollbar-width: none; }
.sidebar::-webkit-scrollbar { display: none; }
.cat-item { padding: 18px 8px 14px; text-align: center; cursor: pointer; position: relative; transition: all .15s; }
.cat-item .icon { font-size: 22px; margin-bottom: 4px; line-height: 1.2; }
.cat-name { font-size: 12px; color: #666; white-space: nowrap; }
.cat-item.active { background: #fff; }
.cat-item.active::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; background: #ff6b35; border-radius: 2px; }
.cat-item.active .cat-name { color: #ff6b35; font-weight: 600; }

/* ===== 右侧菜品区 ===== */
.dish-area { flex: 1; background: #fff; overflow-y: auto; padding-bottom: 180px; scrollbar-width: none; }
.dish-area::-webkit-scrollbar { display: none; }
.section-title { padding: 14px 16px 8px; font-size: 15px; font-weight: bold; color: #333; }
.dish-card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
.dish-img { width: 72px; height: 72px; border-radius: 10px; background: linear-gradient(135deg,#ffd9c2,#ffb38a); flex-shrink: 0; object-fit: cover; }
.dish-info { flex: 1; min-width: 0; }
.dish-name { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 3px; }
.dish-desc { font-size: 12px; color: #999; }
.dish-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-want { background: #ff6b35; color: #fff; font-size: 13px; padding: 6px 14px; border-radius: 20px; border: none; cursor: pointer; }
.btn-recipe { background: #fff; color: #ff6b35; border: 1px solid #ff6b35; font-size: 13px; padding: 6px 14px; border-radius: 20px; cursor: pointer; }

/* ===== 底部记录区 ===== */
.cart-bar { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #eee; padding: 12px 16px; z-index: 5; }
.cart-label { font-size: 12px; color: #aaa; margin-bottom: 6px; }
.cart-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
.cart-row span { font-size: 14px; color: #333; }
.qty-group { display: flex; align-items: center; gap: 6px; }
.qty-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: #f0f0f0; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qty-num { font-size: 14px; font-weight: bold; min-width: 20px; text-align: center; }
.note-input { width: 100%; height: 34px; padding: 0 10px; background: #f8f8f8; border-radius: 6px; font-size: 13px; margin-top: 6px; border: none; box-sizing: border-box; }
.submit-btn { width: 100%; padding: 10px; background: #ff6b35; color: #fff; border-radius: 10px; font-size: 15px; font-weight: bold; margin-top: 8px; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">今天吃什么</div>

  <div class="main">
    <!-- 左侧分类栏 -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 右侧菜品 -->
    <div class="dish-area" id="dishArea"></div>
  </div>

  <!-- 底部记录区 -->
  <div class="cart-bar">
    <div class="cart-label">今天想吃的</div>
    <div id="cartList">
      <div class="cart-row"><span>燕麦牛奶杯</span><div class="qty-group"><button class="qty-btn">-</button><span class="qty-num">1</span><button class="qty-btn">+</button></div></div>
      <div class="cart-row"><span>清炒时蔬</span><div class="qty-group"><button class="qty-btn">-</button><span class="qty-num">1</span><button class="qty-btn">+</button></div></div>
    </div>
    <input class="note-input" placeholder="添加备忘...">
    <button class="submit-btn">记下来</button>
  </div>
</div>

<script>
const categories = [
  { name: '烧菜', icon: '🍲' },
  { name: '凉菜', icon: '🥗' },
  { name: '汤羹', icon: '🍜' },
  { name: '主食', icon: '🍚' },
  { name: '小吃', icon: '🥟' },
  { name: '饮品', icon: '🥤' },
];

const dishes = {
  '烧菜': [
    { name: '番茄炒蛋', desc: '经典家常', img: '#FFDAB9' },
    { name: '清炒时蔬', desc: '清爽健康', img: '#FFE4B5' },
    { name: '红烧鸡翅', desc: '鲜嫩多汁', img: '#DEB887' },
    { name: '麻婆豆腐', desc: '麻辣下饭', img: '#D2691E' },
  ],
  '凉菜': [
    { name: '凉拌黄瓜', desc: '爽脆开胃', img: '#98FB98' },
    { name: '拍黄瓜蒜泥', desc: '夏日必备', img: '#90EE90' },
    { name: '糖拌西红柿', desc: '酸甜可口', img: '#FF6B6B' },
  ],
  '汤羹': [
    { name: '紫菜蛋花汤', desc: '快手暖胃', img: '#FFFACD' },
    { name: '冬瓜排骨汤', desc: '清淡滋补', img: '#F5DEB3' },
  ],
  '主食': [
    { name: '糙米饭', desc: '低GI饱腹', img: '#F5F5DC' },
    { name: '全麦面包', desc: '早餐首选', img: '#DEB887' },
    { name: '燕麦片', desc: '减脂晚餐', img: '#FAEBD7' },
  ],
  '小吃': [
    { name: '蒸饺', desc: '皮薄馅大', img: '#FFEFD5' },
    { name: '小笼包', desc: '鲜美多汁', img: '#FFE4C4' },
  ],
  '饮品': [
    { name: '豆浆', desc: '原味醇香', img: '#FFF8DC' },
    { name: '牛奶', desc: '补钙首选', img: '#FFFAF0' },
  ],
};

let activeCat = categories[0].name;

function renderSidebar() {
  const html = categories.map(c =>
    `<div class="cat-item ${c.name === activeCat ? 'active' : ''}" onclick="switchCat('${c.name}')">
      <div class="icon">${c.icon}</div>
      <div class="cat-name">${c.name}</div>`
  ).join('');
  document.getElementById('sidebar').innerHTML = html;
}

function renderDishes() {
  const list = dishes[activeCat] || [];
  const html =
    '<div class="section-title">' + activeCat + '</div>' +
    list.map(d => `
      <div class="dish-card">
        <div class="dish-img" style="background:${d.img}"></div>
        <div class="dish-info">
          <div class="dish-name">${d.name}</div>
          <div class="dish-desc">${d.desc}</div>
        </div>
        <div class="dish-btns">
          <button class="btn-want">想吃</button>
          <button class="btn-recipe">做法</button>
        </div>`).join('');
  document.getElementById('dishArea').innerHTML = html;
}

function switchCat(name) {
  if (name === activeCat) return;
  activeCat = name;
  renderSidebar();
  const area = document.getElementById('dishArea');
  area.scrollTop = 0;
  renderDishes();
}

renderSidebar();
renderDishes();
</script>
</body>
</html>
